name: Publish MCP Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish, such as v0.1.4
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-mcp-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and publish linux/amd64 MCP image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release tag and project version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag such as v0.1.4; got: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          project_version="$(tr -d '[:space:]' < VERSION)"
          project_version="${project_version#v}"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version $tag_version does not match VERSION ($project_version)." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/keying-research-draw-mcp
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=research-draw-mcp-amd64
          cache-to: type=gha,mode=max,scope=research-draw-mcp-amd64
          provenance: true
          sbom: true
