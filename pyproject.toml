[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-draw"
dynamic = ["version"]
description = "Research plotting CLI for scientific figures and offline maps"
readme = "README.md"
requires-python = "==3.13.15"
authors = [{ name = "Keying Digital Intelligence" }]
dependencies = [
  "numpy>=1.23,<3.0",
  "matplotlib>=3.7,<4.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "pandas>=1.5,<3.0",
  "openpyxl>=3.1,<4.0",

]

[project.optional-dependencies]
data = [
  "pandas>=1.5,<3.0",
  "openpyxl>=3.1,<4.0",
]
stats = [
  "scipy>=1.9,<2.0",
]
ml = [
  "scikit-learn>=1.2,<2.0",
  "scikit-image>=0.22,<1.0",
  "statsmodels>=0.14,<1.0",
  "umap-learn>=0.5,<1.0",
  "upsetplot>=0.8,<1.0",
]
maps = [
  "geopandas>=0.13,<1.0",
  "shapely>=2.0,<3.0",
  "mapclassify>=2.6,<3.0",
  "pyogrio>=0.7,<1.0",
  "fiona>=1.9,<2.0",
]
raster = [
  "rasterio>=1.3,<2.0",
]
web = [
  "fastapi>=0.111,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
]
test = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "types-PyYAML>=6.0.12",
  "types-requests>=2.32.0",
]
mcp = [
  "mcp>=1.0,<2.0",
]
all = [
  "pandas>=1.5,<3.0",
  "openpyxl>=3.1,<4.0",
  "scipy>=1.9,<2.0",
  "scikit-learn>=1.2,<2.0",
  "scikit-image>=0.22,<1.0",
  "statsmodels>=0.14,<1.0",
  "umap-learn>=0.5,<1.0",
  "upsetplot>=0.8,<1.0",
  "geopandas>=0.13,<1.0",
  "shapely>=2.0,<3.0",
  "mapclassify>=2.6,<3.0",
  "pyogrio>=0.7,<1.0",
  "fiona>=1.9,<2.0",
  "rasterio>=1.3,<2.0",
  "fastapi>=0.111,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "types-PyYAML>=6.0.12",
  "types-requests>=2.32.0",
  "mcp>=1.0,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "types-PyYAML>=6.0.12",
  "types-requests>=2.32.0",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
research-draw = "src.main:main"
research-draw-mcp = "src.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
  "data",
  "outputs",
  "research_draw.egg-info",
  "web/frontend/dist",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.13"
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = false
warn_unused_ignores = false
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
files = [
  "src/main.py",
  "src/cli/parser.py",
  "web/backend/app.py",
]
